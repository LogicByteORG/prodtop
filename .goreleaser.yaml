version: 2
project_name: prodtop
before:
  hooks:
    - go mod tidy
builds:
  - id: prodtop
    binary: prodtop
    main: ./cmd/prodtop
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz, zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
